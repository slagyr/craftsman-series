<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Craftsman Series</title>
    <meta name="description" content="Read The Craftsman series online.">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  </head>
  <body>
    <div class="site-shell article-page">
      <header class="site-topbar">
        <a class="site-brand" href="index.html">The Craftsman Series</a>
        <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <aside id="menu-overlay" class="menu-overlay" hidden></aside>
      <aside id="site-menu" class="site-menu" hidden>
        <div class="menu-header">
          <div>
            <p class="eyebrow">Navigate</p>
            <h2>Episodes</h2>
          </div>
          <button id="menu-close" class="menu-close" type="button" aria-label="Close navigation menu">Close</button>
        </div>
        <a class="menu-about-link" href="about.html">About This Series</a>
        <input id="menu-search" class="search-box" type="search" placeholder="Filter episodes">
        <nav id="menu-list" class="menu-list" aria-label="Episode navigation"></nav>
      </aside>

      <header class="article-header">
        <div class="hero-card">
          <p class="eyebrow">Robert C. Martin • 2002-2010</p>
          <h1 id="page-title">Loading article...</h1>
          <p id="page-meta" class="article-meta">Fetching Markdown from this repository.</p>
          <figure id="hero-media" class="hero-media" hidden>
            <img id="hero-image" class="hero-image" alt="">
          </figure>
          <div id="reader-nav-top" class="reader-nav"></div>
        </div>
      </header>

      <main class="panel article-frame">
        <div id="content" class="markdown-body">
          <div class="status">Loading...</div>
        </div>
        <div id="reader-nav-bottom" class="reader-nav reader-nav-bottom"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="articles.js"></script>
    <script src="hero-images.js"></script>
    <script src="site.js"></script>
    <script>
      initReaderPage();
    </script>
  </body>
</html>
