<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Craftsman Series</title>
    <meta name="description" content="Read The Craftsman series online.">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  </head>
  <body>
    <div class="site-shell article-page">
      <header class="article-header">
        <div class="hero-card">
          <p class="eyebrow">The Craftsman Series</p>
          <h1 id="page-title">Loading article...</h1>
          <p id="page-meta" class="article-meta">Fetching Markdown from this repository.</p>
          <div class="article-nav">
            <a class="button-secondary" href="index.html">Back to Index</a>
            <a class="button-secondary" href="README.md">Repository Overview</a>
          </div>
          <div id="reader-nav" class="reader-nav" style="margin-top: 1rem;"></div>
        </div>
      </header>

      <main class="panel article-frame">
        <div id="content" class="markdown-body">
          <div class="status">Loading...</div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="articles.js"></script>
    <script>
      const titleNode = document.getElementById("page-title");
      const metaNode = document.getElementById("page-meta");
      const contentNode = document.getElementById("content");
      const navNode = document.getElementById("reader-nav");

      function stripLeadingHeading(markdown) {
        const lines = markdown.split("\n");
        if (lines[0] && lines[0].startsWith("# ")) {
          lines.shift();
          while (lines[0] === "") {
            lines.shift();
          }
        }
        return lines.join("\n");
      }

      function renderNav(index) {
        navNode.innerHTML = "";
        const links = [];

        if (index > 0) {
          links.push({ label: "Previous Episode", article: ARTICLES[index - 1] });
        }

        links.push({ label: "Open Markdown Source", href: ARTICLES[index].file });

        if (index < ARTICLES.length - 1) {
          links.push({ label: "Next Episode", article: ARTICLES[index + 1] });
        }

        links.forEach((entry) => {
          const link = document.createElement("a");
          link.className = "button-secondary";

          if (entry.article) {
            link.href = articleHref(entry.article.file);
            link.textContent = entry.label;
          } else {
            link.href = entry.href;
            link.textContent = entry.label;
          }

          navNode.appendChild(link);
        });
      }

      function highlightCodeBlocks() {
        contentNode.querySelectorAll("pre code").forEach((block) => {
          hljs.highlightElement(block);
        });
      }

      async function loadArticle() {
        const params = new URLSearchParams(window.location.search);
        const requestedFile = params.get("file");
        const index = ARTICLES.findIndex((article) => article.file === requestedFile);

        if (index === -1) {
          titleNode.textContent = "Article not found";
          metaNode.textContent = "The requested file is not part of the published article index.";
          contentNode.innerHTML = '<div class="status">Return to the index and choose an article from the published list.</div>';
          return;
        }

        const article = ARTICLES[index];
        titleNode.textContent = article.title;
        metaNode.textContent = `${String(articleNumber(article)).padStart(2, "0")} of ${ARTICLES.length}`;
        renderNav(index);

        try {
          const response = await fetch(article.file);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const markdown = stripLeadingHeading(await response.text());
          const html = marked.parse(markdown, {
            headerIds: true,
            mangle: false,
          });

          contentNode.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
          highlightCodeBlocks();
          document.title = `${article.title} | The Craftsman Series`;
        } catch (error) {
          metaNode.textContent = "The article could not be loaded from the repository.";
          contentNode.innerHTML = `<div class="status">${error.message}</div>`;
        }
      }

      loadArticle();
    </script>
  </body>
</html>
